<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Universal ScreenShare</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111522;
      --panel: #1a2030;
      --panel-2: #222a3d;
      --text: #f4f7ff;
      --muted: #9aa6bd;
      --blue: #5792ff;
      --green: #4bd6a0;
      --line: rgba(255,255,255,.09);
    }
    * { box-sizing: border-box; }
    body {
      width: 330px; margin: 0; padding: 18px;
      background: radial-gradient(circle at 50% -10%, #273858 0, var(--bg) 48%);
      color: var(--text); font: 14px/1.45 "Segoe UI", Arial, sans-serif;
    }
    .top { display:flex; align-items:center; gap:11px; margin-bottom:17px; }
    .brand-icon {
      width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
      color:var(--blue);background:rgba(87,146,255,.13);
      border:1px solid rgba(87,146,255,.25);
    }
    .brand-icon svg { width:23px;height:23px; }
    .brand-title { font-size:15px;font-weight:700;letter-spacing:.1px; }
    .brand-sub { color:var(--muted);font-size:11px;margin-top:1px; }
    .version { margin-left:auto;color:#8e9ab1;font-size:10px; }
    .hero {
      border:1px solid var(--line); border-radius:19px; padding:20px 16px 17px;
      background:linear-gradient(160deg,rgba(37,48,72,.96),rgba(25,31,47,.98));
      text-align:center; box-shadow:0 12px 30px rgba(0,0,0,.22);
    }
    .power-wrap { position:relative;width:112px;height:112px;margin:0 auto 12px; }
    .power-halo {
      position:absolute;inset:2px;border-radius:50%;
      background:rgba(87,146,255,.10);filter:blur(13px);
      opacity:0;transition:opacity .25s ease;
    }
    .power-button {
      position:relative;width:100%;height:100%;border-radius:50%;
      border:1px solid rgba(255,255,255,.12);background:#202a40;
      color:#8490a7;display:grid;place-items:center;cursor:pointer;
      transition:transform .18s ease,background .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease;
      outline:none;
    }
    .power-button:hover { transform:translateY(-2px); }
    .power-button:focus-visible { box-shadow:0 0 0 3px rgba(87,146,255,.35); }
    .power-button svg { width:59px;height:59px; }
    .power-button .power-ring { stroke:currentColor; }
    .power-button .power-line { stroke:currentColor; }
    body.enabled .power-button {
      color:var(--blue);background:linear-gradient(145deg,#263c63,#1c2b49);
      border-color:rgba(87,146,255,.65);
      box-shadow:inset 0 0 22px rgba(87,146,255,.12),0 0 22px rgba(87,146,255,.12);
    }
    body.enabled .power-halo { opacity:1; }
    .state {
      display:inline-flex;align-items:center;gap:7px;padding:6px 11px;
      border-radius:99px;background:rgba(255,255,255,.06);
      color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.6px;
    }
    .dot { width:7px;height:7px;border-radius:50%;background:#8993a6; }
    body.enabled .state { color:#a8f0d2;background:rgba(75,214,160,.10); }
    body.enabled .dot { background:var(--green);box-shadow:0 0 9px rgba(75,214,160,.8); }
    .headline { margin:11px 0 3px;font-size:16px;font-weight:700; }
    .hint { color:var(--muted);font-size:11px; }
    .stats { display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px; }
    .stat {
      padding:12px;border:1px solid var(--line);border-radius:13px;
      background:rgba(12,17,29,.32);text-align:left;
    }
    .stat-label { color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px; }
    .stat-value { font-size:19px;font-weight:700;margin-top:3px; }
    .site {
      margin-top:12px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.045);
      color:#c9d3e5;font-size:11px;display:flex;gap:8px;align-items:center;min-width:0;
    }
    .site svg { width:15px;height:15px;flex:none;color:#8dafff; }
    #siteName { overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .foot { color:#7f8ba2;font-size:10px;text-align:center;margin:13px 4px 0; }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { transition:none!important; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="3.5" y="4" width="17" height="12" rx="2.2" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 16v3m-4 1h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <div class="brand-title">Universal ScreenShare</div>
      <div class="brand-sub">Compatibilidad multimedia</div>
    </div>
    <span class="version">1.0.1</span>
  </header>

  <main class="hero">
    <div class="power-wrap">
      <div class="power-halo"></div>
      <button id="toggleButton" class="power-button" type="button"
              aria-label="Activar o desactivar ajustes visuales" aria-pressed="true">
        <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <path class="power-ring" d="M18.5 15.5a23 23 0 1 0 27 0" stroke-width="7.5" stroke-linecap="round"/>
          <path class="power-line" d="M32 7v25" stroke-width="7.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="state"><span class="dot"></span><span id="stateLabel">ACTIVADO</span></div>
    <div class="headline" id="headline">Ajustes visuales activos</div>
    <div class="hint" id="hint">Pulsa el botón para desactivar</div>
  </main>

  <section class="stats" aria-live="polite">
    <div class="stat">
      <div class="stat-label">Reproductores</div>
      <div class="stat-value" id="videoCount">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Estado</div>
      <div class="stat-value" id="shortStatus" style="font-size:14px">Consultando</div>
    </div>
  </section>

  <div class="site">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/>
      <path d="M3.5 12h17M12 3c2.4 2.5 3.5 5.5 3.5 9S14.4 18.5 12 21c-2.4-2.5-3.5-5.5-3.5-9S9.6 5.5 12 3Z" stroke="currentColor" stroke-width="1.4"/>
    </svg>
    <span id="siteName">Consultando página activa…</span>
  </div>
  <p class="foot">Los ajustes se aplican a vídeos HTML5 compatibles.</p>
  <script src="popup.js"></script>
</body>
</html>
